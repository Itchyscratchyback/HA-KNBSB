name: Hassfest validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
