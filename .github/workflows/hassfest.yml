name: Hassfest validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest

    steps:
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
